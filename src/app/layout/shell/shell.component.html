<div class="shell">
  <header class="shell-header">
    <span class="brand">Pedidos360</span>
    <div class="user-box">
      <div class="user-info">
        <span class="user-name">{{ authService.displayName }}</span>
        <span class="user-roles">{{ authService.roles.join(', ') || 'Sin rol asignado' }}</span>
      </div>
      <button type="button" class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <div class="shell-body">
    <nav class="shell-nav">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a *ngIf="canSeeOrders" routerLink="/orders" routerLinkActive="active">Pedidos</a>
      <a *ngIf="canSeeCatalog" routerLink="/catalog" routerLinkActive="active">Catálogo</a>
    </nav>

    <main class="shell-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
